<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You ❤️</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    font-family: Arial, sans-serif;
    color: white;
    background: linear-gradient(135deg, #ff416c, #ff4b8b, #ff758c);
}

.box {
    width: 90%;
    max-width: 420px;
}

.heart {
    font-size: 120px;
    cursor: pointer;
    animation: beat 1s infinite;
    filter: drop-shadow(0 0 25px white);
}

@keyframes beat {
    0%, 100% {
        transform: scale(1);
    }
    50% {
        transform: scale(1.18);
    }
}

h1 {
    font-size: 32px;
    margin: 10px 0;
}

p {
    font-size: 18px;
    line-height: 1.6;
}

button {
    border: none;
    padding: 14px 28px;
    border-radius: 30px;
    background: white;
    color: #ff416c;
    font-size: 17px;
    font-weight: bold;
    margin-top: 10px;
}

#love {
    display: none;
    font-size: 21px;
    margin-top: 20px;
    line-height: 1.6;
}

.heart2 {
    position: absolute;
    animation: float 5s linear infinite;
    font-size: 25px;
}

@keyframes float {
    from {
        transform: translateY(100vh);
        opacity: 1;
    }
    to {
        transform: translateY(-10vh);
        opacity: 0;
    }
}
</style>
</head>

<body>

<div class="box">

    <div class="heart" onclick="openLove()">❤️</div>

    <h1>For My Beautiful Girl ❤️</h1>

    <p>
        Tum meri life ka woh hissa ho<br>
        jise main hamesha apne paas rakhna chahta hoon. 🥺❤️
    </p>

    <button onclick="openLove()">Tap My Heart 💌</button>

    <div id="love">
        Sitara ❤️<br><br>
        I Love You More Than Words Can Say. 🥹❤️<br>
        Always & Forever ♾️
    </div>

</div>

<script>

function openLove() {
    document.getElementById("love").style.display = "block";

    for(let i = 0; i < 15; i++) {
        let heart = document.createElement("div");

        heart.innerHTML = "❤️";
        heart.className = "heart2";

        heart.style.left = Math.random() * 100 + "%";
        heart.style.animationDuration =
            (3 + Math.random() * 3) + "s";

        document.body.appendChild(heart);

        setTimeout(() => {
            heart.remove();
        }, 6000);
    }
}

</script>

</body>
</html>
